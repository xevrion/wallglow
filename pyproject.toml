[project]
name = "wallglow"
version = "0.1.0"
description = "Push Noctalia's wallpaper palette to a BanlanX SP621E LED strip over Bluetooth"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yash Bavadiya" }]
requires-python = ">=3.11"
dependencies = ["bleak>=1.0"]

[project.scripts]
wallglow = "wallglow.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
